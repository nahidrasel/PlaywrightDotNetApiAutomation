name: .NET API Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      APP_Username: ${{ secrets.APP_USERNAME }}
      APP_Password: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET API Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
